# pg.conf: settings for your private PostgreSQL server on HiPerGator.
#
# Every pg-*.sh script and the pg-server.sbatch job read this file.
# Lines are plain bash assignments, so $USER expands to your GatorLink id.
# Precedence, highest first: command-line flags, variables already exported
# in your shell, this file, then the defaults built into pg-lib.sh.
# Delete or comment out a line to fall back to the default.

# Where the database files, password, socket, and logs live.
# Keep it inside your own folder on the class allocation.
PG_HOME=/blue/cop5725/$USER/postgresql

# Name of the database created on first start. Also the default for pgcli
# and for the DATABASE_URL written to connection.env.
PG_DB=cop5725

# Container image. Pin a major version so every student runs the same server.
PG_IMAGE=docker://postgres:18

# A prebuilt copy of that image in the class share folder. When this file
# exists and is readable, the job uses it and skips the download.
PG_SHARED_SIF=/blue/cop5725/share/images/postgres-18.sif

# SLURM settings. Cores and memory are per server; four hours is a working
# session. Raise PG_TIME for long loads; the maximum on hpg-default is 31 days.
# The job name carries your GatorLink id so the class queue shows whose
# server is whose.
PG_JOB_NAME=postgres-$USER
PG_CPUS=2
PG_MEM=8GB
PG_TIME=04:00:00

# Allocation to charge. Leave both empty to use your default account.
PG_ACCOUNT=cop5725
PG_QOS=cop5725

# Optional partition. Leave empty for the scheduler default.
PG_PARTITION=

# The server listens on a random port in this range so two students who land
# on the same node never collide.
PG_PORT_MIN=10000
PG_PORT_MAX=40000
