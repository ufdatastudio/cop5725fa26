title: COP 5725 Fall 26
description: Database Management at the University of Florida
logo: /assets/img/logo.png
show_downloads: false
theme: jekyll-theme-minimal
baseurl: /cop5725fa26

markdown: kramdown
highlighter: rouge
commonmark:
  options: ["SMART", "FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table", "alerts"]
kramdown:
  parse_block_html: true
  html_to_native: true
github: [metadata]

# Lecture decks published onto the site (URL-only) by
# lecture-outlines/publish.mjs during the Pages deploy. Add a deck's
# directory name here to make it available; clear the list to publish
# every built deck.
published_lectures:
  - day1-introduction
  - day2-database-history
  - day3-relational-model
  - day4-relational-algebra-i
  - day5-relational-algebra-ii
  - day6-er-modeling
  - day7-er-to-relations

exclude:
  - simple-syllabus.md
  - projects/project1.md
  - projects/project2.md
  - projects/project3.md
  - projects/project-final.md
  - papers/README.md
  - papers/pdfs/MANUAL.md
  - documents/audit-cross-references.md
  - documents/hipergator-postgres-apptainer.md
  - documents/project0-grading-checklist.md
  - scripts/
  - lecture-outlines/
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
