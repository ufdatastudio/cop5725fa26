title: COP 5725 Fall 26
description: Database Management at the University of Florida
logo: /assets/img/logo.png
show_downloads: false
theme: jekyll-theme-minimal
baseurl: /cop5725fa26

markdown: kramdown
highlighter: rouge
commonmark:
  options: ["SMART", "FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table", "alerts"]
kramdown:
  parse_block_html: true
  html_to_native: true
github: [metadata]

exclude:
  - simple-syllabus.md
  - projects/project1.md
  - projects/project2.md
  - projects/project3.md
  - projects/project-final.md
  - papers/README.md
  - papers/pdfs/MANUAL.md
  - documents/audit-cross-references.md
  - scripts/
  - lecture-outlines/
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
