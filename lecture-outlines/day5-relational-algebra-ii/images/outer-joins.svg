<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">

  <!-- ============ panel 1: inner join ============ -->
  <g>
    <text x="120" y="42" font-size="23" fill="#263238" text-anchor="middle" font-family="'Chalkboard SE','Comic Sans MS','STIX Two Math','Apple Symbols',cursive">&#8904;  inner</text>
    <g transform="translate(88 150)">
      <text x="0" y="-62" font-size="20" fill="#37474F" text-anchor="middle">R</text>
      <text x="64" y="-62" font-size="20" fill="#37474F" text-anchor="middle">S</text>
      <circle cx="0" cy="0" r="48" fill="#FFFFFF"/>
      <circle cx="64" cy="0" r="48" fill="#FFFFFF"/>
      <path d="M 32 -35.8 A 48 48 0 0 1 32 35.8 A 48 48 0 0 1 32 -35.8 Z" fill="#E1BEE7"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <circle cx="64" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
    </g>
    <text x="120" y="242" font-size="16" fill="#607D8B" text-anchor="middle">matched pairs only</text>
  </g>

  <!-- ============ panel 2: left outer ============ -->
  <g>
    <text x="360" y="42" font-size="23" fill="#263238" text-anchor="middle" font-family="'Chalkboard SE','Comic Sans MS','STIX Two Math','Apple Symbols',cursive">&#10197;  left outer</text>
    <g transform="translate(328 150)">
      <text x="0" y="-62" font-size="20" fill="#37474F" text-anchor="middle">R</text>
      <text x="64" y="-62" font-size="20" fill="#37474F" text-anchor="middle">S</text>
      <circle cx="0" cy="0" r="48" fill="#F8BBD0"/>
      <circle cx="64" cy="0" r="48" fill="#FFFFFF"/>
      <path d="M 32 -35.8 A 48 48 0 0 1 32 35.8 A 48 48 0 0 1 32 -35.8 Z" fill="#E1BEE7"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <circle cx="64" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <g transform="rotate(-4 -16 0)">
        <rect x="-44" y="-13" width="58" height="26" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
        <text x="-15" y="6" font-size="14" fill="#263238" text-anchor="middle">+NULL</text>
      </g>
    </g>
    <text x="360" y="242" font-size="16" fill="#607D8B" text-anchor="middle">every R row kept</text>
  </g>

  <!-- ============ panel 3: right outer ============ -->
  <g>
    <text x="600" y="42" font-size="23" fill="#263238" text-anchor="middle" font-family="'Chalkboard SE','Comic Sans MS','STIX Two Math','Apple Symbols',cursive">&#10198;  right outer</text>
    <g transform="translate(568 150)">
      <text x="0" y="-62" font-size="20" fill="#37474F" text-anchor="middle">R</text>
      <text x="64" y="-62" font-size="20" fill="#37474F" text-anchor="middle">S</text>
      <circle cx="0" cy="0" r="48" fill="#FFFFFF"/>
      <circle cx="64" cy="0" r="48" fill="#90CAF9"/>
      <path d="M 32 -35.8 A 48 48 0 0 1 32 35.8 A 48 48 0 0 1 32 -35.8 Z" fill="#E1BEE7"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <circle cx="64" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <g transform="rotate(4 80 0)">
        <rect x="51" y="-13" width="58" height="26" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
        <text x="80" y="6" font-size="14" fill="#263238" text-anchor="middle">+NULL</text>
      </g>
    </g>
    <text x="600" y="242" font-size="16" fill="#607D8B" text-anchor="middle">every S row kept</text>
  </g>

  <!-- ============ panel 4: full outer ============ -->
  <g>
    <text x="840" y="42" font-size="23" fill="#263238" text-anchor="middle" font-family="'Chalkboard SE','Comic Sans MS','STIX Two Math','Apple Symbols',cursive">&#10199;  full outer</text>
    <g transform="translate(808 150)">
      <text x="0" y="-62" font-size="20" fill="#37474F" text-anchor="middle">R</text>
      <text x="64" y="-62" font-size="20" fill="#37474F" text-anchor="middle">S</text>
      <circle cx="0" cy="0" r="48" fill="#F8BBD0"/>
      <circle cx="64" cy="0" r="48" fill="#90CAF9"/>
      <path d="M 32 -35.8 A 48 48 0 0 1 32 35.8 A 48 48 0 0 1 32 -35.8 Z" fill="#E1BEE7"/>
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <circle cx="64" cy="0" r="48" fill="none" stroke="#4E342E" stroke-width="2.5"/>
      <g transform="rotate(-4 -16 0)">
        <rect x="-44" y="-13" width="58" height="26" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
        <text x="-15" y="6" font-size="14" fill="#263238" text-anchor="middle">+NULL</text>
      </g>
      <g transform="rotate(4 80 0)">
        <rect x="51" y="-13" width="58" height="26" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
        <text x="80" y="6" font-size="14" fill="#263238" text-anchor="middle">+NULL</text>
      </g>
    </g>
    <text x="840" y="242" font-size="16" fill="#607D8B" text-anchor="middle">every row from both</text>
  </g>

  <!-- ============ legend ============ -->
  <g>
    <rect x="270" y="272" width="30" height="16" rx="5" fill="#F8BBD0" stroke="#4E342E" stroke-width="2"/>
    <text x="308" y="286" font-size="16" fill="#37474F">unmatched R rows</text>
    <rect x="470" y="272" width="30" height="16" rx="5" fill="#90CAF9" stroke="#4E342E" stroke-width="2"/>
    <text x="508" y="286" font-size="16" fill="#37474F">unmatched S rows</text>
    <rect x="670" y="272" width="30" height="16" rx="5" fill="#E1BEE7" stroke="#4E342E" stroke-width="2"/>
    <text x="708" y="286" font-size="16" fill="#37474F">matched pairs</text>
  </g>
</svg>
