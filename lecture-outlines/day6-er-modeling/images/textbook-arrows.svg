<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
<rect width="1120" height="400" fill="#ffffff"/>
<rect x="45" y="84" width="170" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="130" y="117" font-size="19" fill="#0d47a1" text-anchor="middle">Faculty</text><line x1="215" y1="110" x2="315" y2="110" stroke="#4E342E" stroke-width="2.5"/><polygon points="400,74 485,110 400,146 315,110" fill="#fff9c4" stroke="#f57f17" stroke-width="2.5"/><text x="400" y="116" font-size="17" fill="#e65100" text-anchor="middle">member of</text><line x1="485" y1="110" x2="588" y2="110" stroke="#4E342E" stroke-width="2.5"/><path d="M 582 98 L 604 110 L 582 122" fill="none" stroke="#4E342E" stroke-width="3"/><rect x="605" y="84" width="170" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="690" y="117" font-size="19" fill="#0d47a1" text-anchor="middle">Department</text><text x="810" y="86" font-size="19" fill="#263238">Pointed arrow: at most one</text><text x="810" y="114" font-size="15.5" fill="#37474f">Each faculty member is related to at</text><text x="810" y="138" font-size="15.5" fill="#37474f">most one department. Zero is allowed.</text><text x="810" y="176" font-size="14" fill="#607D8B">Textbook §4.1.6, p. 129</text><rect x="45" y="254" width="170" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="130" y="287" font-size="19" fill="#0d47a1" text-anchor="middle">Faculty</text><line x1="215" y1="280" x2="315" y2="280" stroke="#4E342E" stroke-width="2.5"/><polygon points="400,244 485,280 400,316 315,280" fill="#fff9c4" stroke="#f57f17" stroke-width="2.5"/><text x="400" y="286" font-size="17" fill="#e65100" text-anchor="middle">member of</text><line x1="485" y1="280" x2="588" y2="280" stroke="#4E342E" stroke-width="2.5"/><path d="M 582 264 Q 616 280 582 296" fill="none" stroke="#4E342E" stroke-width="3"/><rect x="605" y="254" width="170" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="690" y="287" font-size="19" fill="#0d47a1" text-anchor="middle">Department</text><text x="810" y="256" font-size="19" fill="#263238">Rounded arrow: exactly one</text><text x="810" y="284" font-size="15.5" fill="#37474f">At most one AND at least one; the</text><text x="810" y="308" font-size="15.5" fill="#37474f">department must exist for the faculty</text><text x="810" y="332" font-size="15.5" fill="#37474f">row to be valid (referential integrity).</text><text x="810" y="370" font-size="14" fill="#607D8B">Textbook §4.3.3, p. 150</text><text x="20" y="380" font-size="14" fill="#607D8B">The rounded head is drawn as a partial circle opening toward the diamond: the "one" side is wrapped, not just pointed at.</text>
</svg>
