ble border (§4.4.3)</text><rect x="600" y="417" width="120" height="36" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/><rect x="605" y="422" width="110" height="26" rx="4" fill="none" stroke="#c62828" stroke-width="1.6"/><text x="740" y="441" font-size="14" fill="#607D8B">red tint, same mark</text><text x="905" y="441" font-size="14" fill="#607D8B">solid vs. dashed line marks</text><text x="905" y="461" font-size="14" fill="#607D8B">identifying relationships</text>
