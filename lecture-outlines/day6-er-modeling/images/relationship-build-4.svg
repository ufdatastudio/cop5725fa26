<rect width="1120" height="420" fill="#ffffff"/>
  <line x1="245" y1="150" x2="345" y2="150" stroke="#4E342E" stroke-width="2.5"/>
  <line x1="515" y1="150" x2="615" y2="150" stroke="#4E342E" stroke-width="2.5"/>
  <line x1="400" y1="175" x2="350" y2="298" stroke="#4E342E" stroke-width="2.5"/>
  <line x1="460" y1="175" x2="510" y2="298" stroke="#4E342E" stroke-width="2.5"/>
  <g><rect x="95" y="124" width="150" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="170" y="157" font-size="19" fill="#0d47a1" text-anchor="middle">Student</text></g>
  <g><rect x="615" y="124" width="150" height="52" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/><text x="690" y="157" font-size="19" fill="#0d47a1" text-anchor="middle">Course</text></g>
  <g><polygon points="430,114 515,150 430,186 345,150" fill="#fff9c4" stroke="#f57f17" stroke-width="2.5"/><text x="430" y="156" font-size="16.5" fill="#e65100" text-anchor="middle">Enrolls</text></g>
