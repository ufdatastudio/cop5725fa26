  <g filter="url(#glow)"><ellipse cx="520" cy="320" rx="56" ry="23" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2"/><text x="520" y="326" font-size="16.5" fill="#4a148c" text-anchor="middle">term</text></g>
  <text x="285" y="132" font-size="21" fill="#e65100" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6">M</text>
  <text x="575" y="132" font-size="21" fill="#e65100" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="6">N</text>
  <g><line x1="810" y1="196" x2="390" y2="305" stroke="#ff6f00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#lead)"/><rect x="810" y="70" width="290" height="144" rx="10" fill="#fff3e0" stroke="#ff6f00" stroke-width="1.5"/><rect x="810" y="70" width="6" height="144" rx="3" fill="#ff6f00"/><rect x="826" y="57" width="92" height="26" rx="13" fill="#ff6f00"/><text x="872" y="75" font-size="13.5" fill="#ffffff" text-anchor="middle">Step 4 of 4</text><text x="830" y="108" font-size="19" fill="#263238">Facts about the pair</text><text x="830" y="132" font-size="15.5" fill="#37474f">grade belongs to the enrollment</text><text x="830" y="156" font-size="15.5" fill="#37474f">itself, not to Student and</text><text x="830" y="180" font-size="15.5" fill="#37474f">not to Course.</text><text x="830" y="202" font-size="13.5" fill="#607D8B">Textbook §4.1.9, p. 134</text></g>
