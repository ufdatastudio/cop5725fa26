  <rect x="680" y="40" width="540" height="490" rx="10" fill="#1e293b"/><text x="698" y="70" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#a78b4a">-- Rule 1 · strong entity → table   (§4.5.1, p. 157)</text><text x="698" y="88" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">CREATE TABLE department (dname text PRIMARY KEY, …);</text><text x="698" y="106" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">CREATE TABLE student (student_id bigint PRIMARY KEY, …);</text><text x="698" y="124" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">CREATE TABLE faculty (fid bigint PRIMARY KEY, …);</text><text x="698" y="142" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">CREATE TABLE course (course_id text PRIMARY KEY, …);</text><text x="698" y="178" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#a78b4a">-- Rule 4 · 1:N → FK on the N side  (§4.5.2, p. 158)</text><text x="698" y="196" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">ALTER TABLE course ADD dname text REFERENCES department;</text><text x="698" y="214" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">ALTER TABLE faculty ADD dname text REFERENCES department;</text><text x="698" y="250" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#a78b4a">-- Rule 2 · weak entity → composite key  (§4.5.4, p. 161)</text><text x="698" y="268" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">CREATE TABLE section (</text><text x="698" y="286" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">  course_id text REFERENCES course(course_id),</text><text x="698" y="304" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">  section_num int, term text, room text,</text><text x="698" y="322" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">  fid bigint REFERENCES faculty(fid),  -- teaches, 1:N</text><text x="698" y="340" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#64748b">  PRIMARY KEY (course_id, section_num, term));</text><text x="698" y="376" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#fbbf24">-- Rule 5 · M:N → junction table  (§4.5.2, p. 158)</text><text x="698" y="394" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">CREATE TABLE enrollment (</text><text x="698" y="412" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">  student_id bigint REFERENCES student(student_id),</text><text x="698" y="430" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">  course_id text, section_num int, term text,</text><text x="698" y="448" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">  grade char(2),  -- the relationship’s attribute</text><text x="698" y="466" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">  PRIMARY KEY (student_id, course_id, section_num, term));</text>
  <g><rect x="30" y="510" width="100" height="28" rx="14" fill="#ff6f00"/><text x="80" y="529" font-size="14" fill="#ffffff" text-anchor="middle">Step 4 of 5</text></g>
