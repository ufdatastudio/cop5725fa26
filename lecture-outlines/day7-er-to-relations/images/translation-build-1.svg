  <rect x="680" y="40" width="540" height="490" rx="10" fill="#1e293b"/><text x="698" y="70" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#fbbf24">-- Rule 1 · strong entity → table   (§4.5.1, p. 157)</text><text x="698" y="88" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">CREATE TABLE department (dname text PRIMARY KEY, …);</text><text x="698" y="106" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">CREATE TABLE student (student_id bigint PRIMARY KEY, …);</text><text x="698" y="124" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">CREATE TABLE faculty (fid bigint PRIMARY KEY, …);</text><text x="698" y="142" font-size="13.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#e2e8f0">CREATE TABLE course (course_id text PRIMARY KEY, …);</text>
