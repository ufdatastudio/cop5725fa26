<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <defs>
    <marker id="fdarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4E342E"/>
    </marker>
  </defs>

  <!-- ============ column headers ============ -->
  <text x="240" y="42" font-size="20" fill="#1565C0" text-anchor="middle">course_id</text>
  <text x="430" y="42" font-size="20" fill="#6A1B9A" text-anchor="middle">instructor</text>
  <text x="600" y="42" font-size="20" fill="#37474F" text-anchor="middle">grade</text>

  <!-- ============ tuple t1 ============ -->
  <text x="118" y="88" font-size="21" fill="#37474F" text-anchor="end">t&#8321;</text>
  <rect x="150" y="58" width="180" height="44" rx="12" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"/>
  <text x="240" y="87" font-size="20" fill="#263238" text-anchor="middle">COP5725</text>
  <rect x="340" y="58" width="180" height="44" rx="12" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2.5"/>
  <text x="430" y="87" font-size="20" fill="#263238" text-anchor="middle">Grant</text>
  <rect x="530" y="58" width="140" height="44" rx="12" fill="#FFFFFF" stroke="#4E342E" stroke-width="2.5"/>
  <text x="600" y="87" font-size="20" fill="#263238" text-anchor="middle">A</text>

  <!-- ============ tuple t2 ============ -->
  <text x="118" y="142" font-size="21" fill="#37474F" text-anchor="end">t&#8322;</text>
  <rect x="150" y="112" width="180" height="44" rx="12" fill="#90CAF9" stroke="#1565C0" stroke-width="2.5"/>
  <text x="240" y="141" font-size="20" fill="#263238" text-anchor="middle">COP5725</text>
  <rect x="340" y="112" width="180" height="44" rx="12" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2.5"/>
  <text x="430" y="141" font-size="20" fill="#263238" text-anchor="middle">Grant</text>
  <rect x="530" y="112" width="140" height="44" rx="12" fill="#FFFFFF" stroke="#4E342E" stroke-width="2.5"/>
  <text x="600" y="141" font-size="20" fill="#263238" text-anchor="middle">B</text>

  <!-- ============ sticky note: agree on X ============ -->
  <g transform="rotate(-3 240 208)">
    <rect x="148" y="186" width="184" height="44" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
    <text x="240" y="205" font-size="16" fill="#263238" text-anchor="middle">the tuples agree</text>
    <text x="240" y="224" font-size="16" fill="#263238" text-anchor="middle">on X&#8230;</text>
  </g>
  <path d="M 240 184 Q 238 172 240 160" fill="none" stroke="#4E342E" stroke-width="2.5" marker-end="url(#fdarrow)"/>

  <!-- ============ sticky note: forced on Y ============ -->
  <g transform="rotate(2 430 208)">
    <rect x="338" y="186" width="184" height="44" rx="10" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
    <text x="430" y="205" font-size="16" fill="#263238" text-anchor="middle">&#8230;so the FD forces</text>
    <text x="430" y="224" font-size="16" fill="#263238" text-anchor="middle">them to agree on Y</text>
  </g>
  <path d="M 430 184 Q 432 172 430 160" fill="none" stroke="#4E342E" stroke-width="2.5" marker-end="url(#fdarrow)"/>

  <!-- ============ grade caption ============ -->
  <path d="M 600 186 Q 598 174 600 160" fill="none" stroke="#4E342E" stroke-width="2.5" marker-end="url(#fdarrow)"/>
  <text x="600" y="208" font-size="16" fill="#607D8B" text-anchor="middle">everything else is</text>
  <text x="600" y="227" font-size="16" fill="#607D8B" text-anchor="middle">free to differ</text>

  <!-- ============ FD label on the right ============ -->
  <text x="810" y="100" font-size="24" fill="#263238" text-anchor="middle">course_id &#8594;</text>
  <text x="810" y="130" font-size="24" fill="#263238" text-anchor="middle">instructor</text>

  <!-- ============ legend ============ -->
  <g>
    <rect x="220" y="262" width="34" height="18" rx="6" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/>
    <text x="264" y="277" font-size="17" fill="#37474F">X, the determinant</text>
    <rect x="500" y="262" width="34" height="18" rx="6" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2"/>
    <text x="544" y="277" font-size="17" fill="#37474F">Y, the dependent</text>
  </g>
</svg>
