<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <defs>
    <marker id="karrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4E342E"/>
    </marker>
  </defs>

  <!-- ============ student table ============ -->
  <text x="232" y="88" font-size="26" fill="#263238">student</text>
  <rect x="230" y="100" width="400" height="132" rx="10" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>
  <rect x="231" y="101" width="398" height="42" rx="8" fill="#FFE082"/>
  <path d="M 230 144 L 630 144" stroke="#4E342E" stroke-width="3"/>
  <path d="M 370 100 L 370 232" stroke="#4E342E" stroke-width="2"/>
  <path d="M 500 100 L 500 232" stroke="#4E342E" stroke-width="2"/>
  <path d="M 230 188 L 630 188" stroke="#4E342E" stroke-width="1.5"/>

  <!-- primary key star inside student_id header -->
  <path d="M 246 122 L 250 130 L 259 131 L 252 137 L 254 146 L 246 141 L 238 146 L 240 137 L 233 131 L 242 130 Z"
        fill="#FFC107" stroke="#4E342E" stroke-width="2"/>

  <text x="266" y="130" font-size="20" fill="#263238">student_id</text>
  <text x="384" y="130" font-size="20" fill="#263238">name</text>
  <text x="514" y="130" font-size="20" fill="#263238">ufid</text>

  <text x="286" y="174" font-size="19" fill="#37474F">7</text>
  <text x="384" y="174" font-size="19" fill="#37474F">Ada</text>
  <text x="514" y="174" font-size="19" fill="#37474F">1122-3344</text>

  <text x="286" y="218" font-size="19" fill="#37474F">8</text>
  <text x="384" y="218" font-size="19" fill="#37474F">Alan</text>
  <text x="514" y="218" font-size="19" fill="#37474F">5566-7788</text>

  <!-- superkey: dashed loop around {student_id, name} headers -->
  <rect x="224" y="94" width="284" height="56" rx="14" fill="none" stroke="#F9A825" stroke-width="4" stroke-dasharray="12 8"/>

  <!-- ============ primary key label ============ -->
  <g transform="rotate(-3 105 150)">
    <rect x="15" y="122" width="180" height="62" rx="16" fill="#90CAF9" stroke="#4E342E" stroke-width="3"/>
    <text x="35" y="149" font-size="22" fill="#263238">primary key</text>
    <text x="46" y="175" font-size="17" fill="#37474F">(our pick)</text>
  </g>
  <path d="M 196 148 Q 216 140 236 132" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#karrow)"/>

  <!-- ============ candidate keys label ============ -->
  <g transform="rotate(2 780 60)">
    <rect x="660" y="26" width="228" height="62" rx="16" fill="#A5D6A7" stroke="#4E342E" stroke-width="3"/>
    <text x="682" y="53" font-size="22" fill="#263238">candidate keys</text>
    <text x="694" y="79" font-size="17" fill="#37474F">(nothing to spare)</text>
  </g>
  <path d="M 730 92 Q 640 96 545 112" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#karrow)"/>
  <path d="M 700 96 Q 480 40 310 96" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#karrow)"/>

  <!-- ============ superkey label ============ -->
  <g transform="rotate(-2 110 300)">
    <rect x="15" y="268" width="230" height="88" rx="16" fill="#FFE082" stroke="#4E342E" stroke-width="3"/>
    <text x="38" y="297" font-size="22" fill="#263238">superkey</text>
    <text x="38" y="322" font-size="17" fill="#37474F">{student_id, name}</text>
    <text x="38" y="345" font-size="17" fill="#37474F">works, but not minimal</text>
  </g>
  <path d="M 210 264 Q 230 210 250 156" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#karrow)"/>

  <!-- ============ enrollment table ============ -->
  <text x="432" y="418" font-size="26" fill="#263238">enrollment</text>
  <rect x="430" y="430" width="300" height="132" rx="10" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>
  <rect x="431" y="431" width="298" height="42" rx="8" fill="#F8BBD0"/>
  <path d="M 430 474 L 730 474" stroke="#4E342E" stroke-width="3"/>
  <path d="M 570 430 L 570 562" stroke="#4E342E" stroke-width="2"/>
  <path d="M 430 518 L 730 518" stroke="#4E342E" stroke-width="1.5"/>

  <text x="446" y="460" font-size="20" fill="#263238">student_id</text>
  <text x="586" y="460" font-size="20" fill="#263238">course_id</text>

  <text x="486" y="504" font-size="19" fill="#37474F">7</text>
  <text x="586" y="504" font-size="19" fill="#37474F">COP5725</text>

  <text x="486" y="548" font-size="19" fill="#37474F">8</text>
  <text x="586" y="548" font-size="19" fill="#37474F">CIS6930</text>

  <!-- foreign key reference arrow: enrollment.student_id up to student.student_id -->
  <path d="M 470 428 Q 330 340 300 240" fill="none" stroke="#AD1457" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#karrow)"/>
  <text x="255" y="345" font-size="18" fill="#AD1457" transform="rotate(-58 285 345)">must match!</text>

  <!-- ============ foreign key label ============ -->
  <g transform="rotate(-3 140 510)">
    <rect x="40" y="478" width="200" height="62" rx="16" fill="#F8BBD0" stroke="#4E342E" stroke-width="3"/>
    <text x="62" y="505" font-size="22" fill="#263238">foreign key</text>
    <text x="70" y="531" font-size="17" fill="#37474F">(points home)</text>
  </g>
  <path d="M 242 508 Q 320 490 424 460" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#karrow)"/>
</svg>
