<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4E342E"/>
    </marker>
  </defs>

  <!-- ============ the relation (table) ============ -->
  <g>
    <!-- relation name -->
    <text x="215" y="95" font-size="30" fill="#263238">Movies</text>

    <!-- table body -->
    <rect x="210" y="110" width="515" height="198" rx="10" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>

    <!-- header row -->
    <path d="M 210 158 L 725 158" stroke="#4E342E" stroke-width="3"/>
    <rect x="211" y="111" width="513" height="46" rx="8" fill="#FFE082"/>

    <!-- attribute header highlight (genre) -->
    <rect x="617" y="113" width="105" height="42" rx="8" fill="#A5D6A7" stroke="#2E7D32" stroke-width="3"/>

    <!-- tuple highlight (Star Wars row) -->
    <rect x="213" y="209" width="509" height="48" rx="8" fill="#F8BBD0" stroke="#AD1457" stroke-width="3"/>

    <!-- column separators -->
    <path d="M 440 110 L 440 308" stroke="#4E342E" stroke-width="2"/>
    <path d="M 520 110 L 520 308" stroke="#4E342E" stroke-width="2"/>
    <path d="M 615 110 L 615 308" stroke="#4E342E" stroke-width="2"/>
    <!-- row separators -->
    <path d="M 210 208 L 725 208" stroke="#4E342E" stroke-width="1.5"/>
    <path d="M 210 258 L 725 258" stroke="#4E342E" stroke-width="1.5"/>

    <!-- header text -->
    <text x="225" y="142" font-size="21" fill="#263238">title</text>
    <text x="453" y="142" font-size="21" fill="#263238">year</text>
    <text x="530" y="142" font-size="21" fill="#263238">length</text>
    <text x="633" y="142" font-size="21" fill="#263238">genre</text>

    <!-- row 1 -->
    <text x="225" y="190" font-size="19" fill="#37474F">Gone With the Wind</text>
    <text x="453" y="190" font-size="19" fill="#37474F">1939</text>
    <text x="545" y="190" font-size="19" fill="#37474F">231</text>
    <text x="633" y="190" font-size="19" fill="#37474F">drama</text>

    <!-- row 2 (the tuple) -->
    <text x="225" y="240" font-size="19" fill="#37474F">Star Wars</text>
    <text x="453" y="240" font-size="19" fill="#37474F">1977</text>
    <text x="545" y="240" font-size="19" fill="#37474F">124</text>
    <text x="633" y="240" font-size="19" fill="#37474F">sciFi</text>

    <!-- row 3 -->
    <text x="225" y="290" font-size="19" fill="#37474F">Wayne's World</text>
    <text x="453" y="290" font-size="19" fill="#37474F">1992</text>
    <text x="545" y="290" font-size="19" fill="#37474F">95</text>
    <text x="633" y="290" font-size="19" fill="#37474F">comedy</text>
  </g>

  <!-- ============ relation label ============ -->
  <g transform="rotate(-4 95 55)">
    <rect x="25" y="30" width="140" height="50" rx="16" fill="#90CAF9" stroke="#4E342E" stroke-width="3"/>
    <text x="49" y="63" font-size="26" fill="#263238">relation</text>
  </g>
  <path d="M 160 78 Q 200 100 212 118" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ attribute label ============ -->
  <g transform="rotate(3 810 45)">
    <rect x="735" y="20" width="150" height="50" rx="16" fill="#A5D6A7" stroke="#4E342E" stroke-width="3"/>
    <text x="755" y="53" font-size="26" fill="#263238">attribute</text>
  </g>
  <path d="M 795 72 Q 760 95 700 112" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ tuple label ============ -->
  <g transform="rotate(-3 95 235)">
    <rect x="35" y="210" width="115" height="50" rx="16" fill="#F8BBD0" stroke="#4E342E" stroke-width="3"/>
    <text x="60" y="243" font-size="26" fill="#263238">tuple</text>
  </g>
  <path d="M 150 233 Q 180 233 205 233" fill="none" stroke="#4E342E" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ domain bubble ============ -->
  <g>
    <ellipse cx="465" cy="452" rx="245" ry="72" fill="#E1BEE7" stroke="#4E342E" stroke-width="3"/>
    <circle cx="480" cy="356" r="10" fill="#E1BEE7" stroke="#4E342E" stroke-width="3"/>
    <circle cx="470" cy="330" r="7" fill="#E1BEE7" stroke="#4E342E" stroke-width="3"/>
    <text x="278" y="440" font-size="26" fill="#263238">domain of year:</text>
    <text x="278" y="478" font-size="22" fill="#37474F">whole numbers ( …, 1939, 1977, 1992, … )</text>
  </g>
</svg>
