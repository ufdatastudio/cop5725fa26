<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
  <defs>
    <marker id="clarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E7D32"/>
    </marker>
    <marker id="clpink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#AD1457"/>
    </marker>
  </defs>

  <!-- ============ SUM annotation ============ -->
  <text x="445" y="28" font-size="17" fill="#2E7D32" text-anchor="middle">SUM(amount) opens this file and skips the rest</text>
  <path d="M 530 34 Q 516 52 500 66" fill="none" stroke="#2E7D32" stroke-width="2.5" marker-end="url(#clarrow)"/>

  <!-- ============ sale_id file ============ -->
  <text x="185" y="62" font-size="17" fill="#263238" text-anchor="middle">sale_id file</text>
  <rect x="90" y="72" width="190" height="186" rx="12" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>
  <g stroke="#4E342E" stroke-width="2">
    <rect x="104" y="92" width="162" height="36" fill="#FFFFFF"/>
    <rect x="104" y="132" width="162" height="36" fill="#F8BBD0"/>
    <rect x="104" y="172" width="162" height="36" fill="#FFFFFF"/>
    <rect x="104" y="212" width="162" height="36" fill="#FFFFFF"/>
  </g>
  <g font-size="16" fill="#263238" text-anchor="middle">
    <text x="185" y="116">10001</text><text x="185" y="156">10002</text><text x="185" y="196">10003</text><text x="185" y="236">10004</text>
  </g>

  <!-- ============ amount file ============ -->
  <text x="445" y="62" font-size="17" fill="#263238" text-anchor="middle">amount file</text>
  <rect x="350" y="72" width="190" height="186" rx="12" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>
  <g stroke="#2E7D32" stroke-width="2">
    <rect x="364" y="92" width="162" height="36" fill="#A5D6A7"/>
    <rect x="364" y="172" width="162" height="36" fill="#A5D6A7"/>
    <rect x="364" y="212" width="162" height="36" fill="#A5D6A7"/>
  </g>
  <rect x="364" y="132" width="162" height="36" fill="#A5D6A7" stroke="#AD1457" stroke-width="3.5"/>
  <g font-size="16" fill="#263238" text-anchor="middle">
    <text x="445" y="116">100.00</text><text x="445" y="156">45.50</text><text x="445" y="196">220.00</text><text x="445" y="236">75.25</text>
  </g>

  <!-- ============ sale_date file ============ -->
  <text x="705" y="62" font-size="17" fill="#263238" text-anchor="middle">sale_date file</text>
  <rect x="610" y="72" width="190" height="186" rx="12" fill="#FFF8E1" stroke="#4E342E" stroke-width="3"/>
  <g stroke="#4E342E" stroke-width="2">
    <rect x="624" y="92" width="162" height="36" fill="#FFFFFF"/>
    <rect x="624" y="132" width="162" height="36" fill="#F8BBD0"/>
    <rect x="624" y="172" width="162" height="36" fill="#FFFFFF"/>
    <rect x="624" y="212" width="162" height="36" fill="#FFFFFF"/>
  </g>
  <g font-size="16" fill="#263238" text-anchor="middle">
    <text x="705" y="116">Jan 15</text><text x="705" y="156">Jan 15</text><text x="705" y="196">Jan 16</text><text x="705" y="236">Jan 16</text>
  </g>

  <!-- row 2 reassembly connectors -->
  <line x1="266" y1="150" x2="364" y2="150" stroke="#AD1457" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="526" y1="150" x2="624" y2="150" stroke="#AD1457" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- reassembly note -->
  <text x="878" y="128" font-size="15" fill="#37474F" text-anchor="middle">rebuilding row 2</text>
  <text x="878" y="147" font-size="15" fill="#37474F" text-anchor="middle">gathers one value</text>
  <text x="878" y="166" font-size="15" fill="#37474F" text-anchor="middle">from every file</text>
  <path d="M 838 152 Q 812 152 794 151" fill="none" stroke="#AD1457" stroke-width="2" marker-end="url(#clpink)"/>

  <!-- ============ legend ============ -->
  <rect x="90" y="292" width="26" height="15" rx="5" fill="#F8BBD0" stroke="#AD1457" stroke-width="2"/>
  <text x="123" y="305" font-size="15" fill="#37474F">the same logical row, now split up</text>
  <rect x="410" y="292" width="26" height="15" rx="5" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
  <text x="443" y="305" font-size="15" fill="#37474F">the amount column, now contiguous</text>
</svg>
