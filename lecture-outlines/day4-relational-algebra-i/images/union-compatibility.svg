    <rect x="824" y="190" width="118" height="42" rx="8" fill="#90CAF9" stroke="#4E342E" stroke-width="2.5"/>
    <text x="883" y="217" font-size="18" fill="#263238" text-anchor="middle">species</text>

    <circle cx="825" cy="272" r="24" fill="#FFCDD2" stroke="#C62828" stroke-width="3"/>
    <path d="M 815 262 L 835 282 M 835 262 L 815 282" fill="none" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>

    <text x="825" y="322" font-size="17" fill="#37474F" text-anchor="middle">position 2: number vs text</text>
  </g>

  <!-- ============ legend ============ -->
  <g>
    <rect x="388" y="352" width="22" height="15" rx="4" fill="#90CAF9" stroke="#4E342E" stroke-width="2"/>
    <text x="418" y="365" font-size="16" fill="#607D8B">text</text>
    <rect x="480" y="352" width="22" height="15" rx="4" fill="#FFE082" stroke="#4E342E" stroke-width="2"/>
